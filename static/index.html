<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Menu</title>
    <meta name="theme-color" content="#fbf7f2" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#1c1917" media="(prefers-color-scheme: dark)">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="Menu">
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header class="topbar">
        <h1 id="title">Menu</h1>
        <button id="generate" class="btn primary" data-view="menu">New menu</button>
        <button id="add-dish" class="btn primary" data-view="dishes" hidden>Add dish</button>
    </header>

    <main>
        <section id="view-menu">
            <div class="segmented" role="group" aria-label="Weeks to plan">
                <button data-weeks="1">1 week</button>
                <button data-weeks="2">2 weeks</button>
            </div>
            <p id="menu-notice" class="notice" hidden></p>
            <div id="menu"></div>
            <p class="hint">Hold and drag a meal to swap it. Tap to pick a different dish.</p>
        </section>

        <section id="view-dishes" hidden>
            <input id="dish-search" type="search" placeholder="Search dishes, tags, ingredients" autocomplete="off">
            <p id="dish-count" class="hint"></p>
            <ul id="dish-list" class="list"></ul>
        </section>
    </main>

    <nav class="tabbar">
        <button data-tab="menu" aria-current="page">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5h16M4 12h16M4 19h10"/></svg>
            Menu
        </button>
        <button data-tab="dishes">
            <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="4"/></svg>
            Dishes
        </button>
    </nav>

    <dialog id="picker">
        <form method="dialog" class="sheet">
            <header>
                <h2 id="picker-title"></h2>
                <button class="btn" value="cancel">Close</button>
            </header>
            <input id="picker-search" type="search" placeholder="Search dishes" autocomplete="off">
            <ul id="picker-list" class="list"></ul>
            <footer>
                <button id="picker-clear" type="button" class="btn danger">Clear this meal</button>
            </footer>
        </form>
    </dialog>

    <dialog id="editor">
        <form id="editor-form" class="sheet">
            <header>
                <h2 id="editor-title">Add dish</h2>
                <button type="button" class="btn" id="editor-cancel">Cancel</button>
            </header>
            <label>Name
                <input name="name" required autocomplete="off" placeholder="e.g. Spaghetti bolognese">
            </label>
            <label>Tag
                <input name="tag" required list="tag-options" autocomplete="off" autocapitalize="none" placeholder="e.g. beef, fish, vegetarian">
            </label>
            <div class="field">
                <span>Ingredients</span>
                <div id="chips" class="chips"></div>
                <div class="row">
                    <input id="ingredient-input" list="ingredient-options" autocomplete="off" autocapitalize="none" placeholder="Add an ingredient">
                    <button type="button" class="btn" id="ingredient-add">Add</button>
                </div>
                <small>Tap an ingredient to mark it as a staple (oil, salt…). Staples are ignored when matching what you have at home.</small>
            </div>
            <label>Notes
                <textarea name="notes" rows="2" placeholder="Optional: link to the recipe, tips…"></textarea>
            </label>
            <footer>
                <button type="button" class="btn danger" id="editor-delete" hidden>Delete</button>
                <button type="submit" class="btn primary">Save</button>
            </footer>
        </form>
    </dialog>

    <datalist id="tag-options"></datalist>
    <datalist id="ingredient-options"></datalist>
    <div id="toast" role="status" aria-live="polite"></div>

    <script src="app.js"></script>
</body>
</html>
